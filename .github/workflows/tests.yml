name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"      # the oldest version setup.py allows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            setup.py
            requirements.txt

      # The views are Tk windows: Linux runners have no display and no Tk libraries.
      - name: Tk and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tk xvfb
          Xvfb :99 -screen 0 1600x1200x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-timeout

      - name: Versions
        run: |
          python -c "import sys, tkinter, numpy, scipy, h5py, matplotlib, pandas; print(sys.version); print('Tk', tkinter.TkVersion, '| numpy', numpy.__version__, '| scipy', scipy.__version__, '| h5py', h5py.__version__, '| matplotlib', matplotlib.__version__, '| pandas', pandas.__version__)"

      # One pytest process per test file, each with a time limit: a view that never
      # returns then fails its own file instead of holding the whole run.
      - name: Tests
        shell: bash
        run: |
          failed=()
          for file in tests/test_*.py; do
            echo "::group::$file"
            python -m pytest "$file" -q --timeout=600 --timeout-method=thread || failed+=("$file")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::failed: %s\n' "${failed[@]}"
            exit 1
          fi
          echo "all test files passed"
