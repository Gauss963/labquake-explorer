name: tests

# Every push to a branch of this repository (or of a fork with Actions enabled), and
# pull requests that come from a fork; a pull request from a branch of this repository
# is already tested by its pushes.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"      # the oldest version setup.py allows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            setup.py
            requirements.txt

      # The views are Tk windows: Linux runners have no display and no Tk libraries.
      - name: Tk and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tk xvfb
          Xvfb :99 -screen 0 1600x1200x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # The tests that drive real Tk windows need a screen that holds them: the runner's is 1024 x 768.
      - name: A larger screen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-timeout

      - name: Versions
        run: |
          python -c "import sys, tkinter, numpy, scipy, h5py, matplotlib, pandas; print(sys.version); print('Tk', tkinter.TkVersion, '| numpy', numpy.__version__, '| scipy', scipy.__version__, '| h5py', h5py.__version__, '| matplotlib', matplotlib.__version__, '| pandas', pandas.__version__)"

      # One pytest process per test file, and a time limit on every test: a view that
      # never returns then fails its own file instead of holding the whole run.  The tests
      # that fail are named as annotations, with their output in the job summary.
      - name: Tests
        shell: bash
        run: |
          failed=()
          for file in tests/test_*.py; do
            echo "::group::$file"
            if ! python -m pytest "$file" -q -rfE --timeout=180 --timeout-method=thread 2>&1 | tee pytest.log; then
              failed+=("$file")
              grep -E '^(FAILED|ERROR) ' pytest.log | sed 's/^/::error::/' || true
              { echo "### $file"; echo '```'; tail -n 80 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::failed: %s\n' "${failed[@]}"
            exit 1
          fi
          echo "all test files passed"
